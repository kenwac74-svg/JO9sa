<!doctype html><meta charset="utf-8"><title>2.4.2 기존 세이브 바로 불러오기</title><style>body{margin:0;background:#14202b;color:#f5e8ce;font:22px/1.6 "Malgun Gothic",sans-serif}main{max-width:1050px;padding:50px;margin:auto}h1{font-size:40px;color:#efc477;margin:0 0 12px}p{margin:12px 0}ol{padding-left:38px}li{padding:13px 18px;background:#233647;margin:10px 0;border-radius:8px}strong{color:#ffdc92}.foot{font-size:18px;color:#bfcbd5}</style><main><h1>기존 세이브로 바로 이어서</h1><p>2.4.1 일반 화면에서 저장한 세이브를 지원합니다.</p><ol><li>원래 세이브는 그대로 보관합니다.</li><li>세이브 파일을 새 2.4.2의 <strong>game/save</strong>에 복사합니다.</li><li>게임 실행 후 <strong>Game → Load</strong>로 불러옵니다.<br>필요한 보정은 불러올 때 자동으로 적용됩니다.</li><li><strong>새 이름으로 저장</strong>하고 계속 플레이합니다.</li></ol><p>별도 호환기 실행이나 사전 변환은 필요하지 않습니다.</p><p class="foot">직접 지은 이름·사용자 지정 이미지·육성·장비·관계·진행 기록 유지<br>지원 범위: 2.4.1 전투 밖 일반 화면 저장</p></main>
