<details id="choiceFormatBox">
 <summary>선택지 서식</summary>
 <p class="muted">현재 페이지의 기존 선택지 한 곳을 고릅니다. 입력한 항목만 바꿉니다. 기존 값이 있는 항목을 비우면 게임 기본값으로 돌아갑니다. px 이외 단위·기존 색 이름은 입력칸에 표시하지 않고 유지합니다.</p>
 <label>서식을 바꿀 선택지<select id="choiceFormatTarget" disabled></select></label>
 <div class="choice-format-fields">
  <label>글꼴<input id="choiceFormatFontFamily" maxlength="200" placeholder="게임 기본값 · 글꼴 이름 직접 입력"></label>
  <label>글자 크기 (px)<input id="choiceFormatFontSize" type="number" min="6" max="120" step="0.5" placeholder="게임 기본값"></label>
  <label>자간 (px)<input id="choiceFormatLetterSpacing" type="number" min="-10" max="40" step="0.1" placeholder="게임 기본값"></label>
  <label>줄간격 (배수)<input id="choiceFormatLineHeight" type="number" min="0.5" max="4" step="0.1" placeholder="게임 기본값"></label>
  <label title="원래 줄바꿈은 유지하며 선택지 아래 간격을 더하거나 줄입니다.">문단 간격 보정 (px)<input id="choiceFormatParagraphGap" type="number" min="-120" max="240" step="1" placeholder="게임 기본값"></label>
  <label>색상<span class="choice-format-color"><input id="choiceFormatColorPicker" type="color" value="#0000ff" aria-label="선택지 색상 고르기"><input id="choiceFormatColor" maxlength="7" placeholder="게임 기본값 또는 #RRGGBB" aria-label="선택지 색상 값"></span></label>
 </div>
 <p id="choiceFormatStatus" class="muted" role="status">대사를 먼저 선택하세요.</p>
 <div class="row"><button id="choiceFormatPreview" type="button" disabled>선택지 서식 미리보기</button><button id="choiceFormatReset" type="button" disabled>게임 기본 서식으로</button></div>
 <div id="choiceFormatPreviewBox" hidden>
  <p id="choiceFormatPreviewNote" class="muted"></p>
  <div id="choiceFormatPreviewText" class="choice-format-preview-text"><div id="choiceFormatSample" class="choice-format-sample"></div><div class="choice-format-next">다음 선택지 · 다음 문단의 위치 확인</div></div>
 </div>
</details>
<!-- JO9 MOD END CHOICE_FORMAT_UI_20261118 -->
