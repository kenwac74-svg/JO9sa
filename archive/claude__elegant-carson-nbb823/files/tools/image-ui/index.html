<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JO9 이미지 편집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e8ecf4;font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:23px;margin:0}small,.hint{color:#9da9bd;font-size:13px;line-height:1.6}button,input,textarea,select{font:inherit}button,select,input[type=number]{background:#252c3a;color:#e8ecf4;border:1px solid #3c475d;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}button.primary{background:#789cff;color:#101626;font-weight:700;border:0}input[type=file]{width:100%;margin-top:8px;font-size:12px}textarea,input[type=password]{width:100%;background:#151a24;border:1px solid #3c475d;border-radius:8px;color:white;padding:12px}textarea{resize:vertical;min-height:120px}label{display:block;margin:16px 0 8px;font-weight:600}.layout{display:grid;grid-template-columns:285px 1fr;gap:22px}.panel{background:#1b202b;border:1px solid #2d3545;border-radius:12px;padding:18px}.images{display:grid;grid-template-columns:1fr 1fr;gap:16px}.imagebox{min-width:0}.stage{position:relative;min-height:320px;background:repeating-conic-gradient(#222936 0% 25%,#1a202c 0% 50%) 0/24px 24px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.stage img{display:block;max-width:100%;max-height:650px}.placeholder{color:#8591a8;padding:35px;text-align:center}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.face{max-height:100px;max-width:100%;margin-top:10px;border-radius:6px}.hidden{display:none!important}.expand{display:grid;grid-template-columns:1fr 1fr;gap:8px}.expand label{margin:5px 0;font-size:12px}.expand input{width:100%}#status{white-space:pre-wrap;margin:16px 0;line-height:1.6;color:#b6c8fa}#generate{width:100%;margin-top:15px}dialog{background:#1b202b;color:white;border:1px solid #3c475d;border-radius:12px;max-width:430px}dialog::backdrop{background:#000a}@media(max-width:850px){.layout{grid-template-columns:1fr}.images{grid-template-columns:1fr}main{padding:16px}.stage{min-height:200px}}
</style>
<main>
<header><div><h1>JO9 이미지 편집</h1><small>원본 + 프롬프트 · 캐릭터 참조</small></div><button id="keyButton">API 설정</button></header>
<div class="layout"><aside class="panel">
<label for="source">1. 편집할 원본</label><input id="source" type="file" accept="image/png,image/jpeg,image/webp">
<label for="face">얼굴 기준 이미지 <small>선택</small></label><input id="face" type="file" accept="image/png,image/jpeg,image/webp"><img id="facePreview" class="face hidden" alt="캐릭터 기준"><button id="clearFace" class="hidden">기준 이미지 제거</button>
<label for="mode">2. 작업 방식</label><select id="mode" style="width:100%"><option value="img2img">img2img · 이미지 편집</option><option value="inpaint">인페인팅 · 칠한 영역 수정</option><option value="outpaint">아웃페인팅 · 바깥 확장</option></select>
<div id="paintTools" class="hidden"><label for="brush">브러시 크기</label><input id="brush" type="range" min="5" max="200" value="40"><button id="clearMask">칠한 영역 지우기</button></div>
<div id="expandTools" class="hidden"><label>확장 크기 (픽셀)</label><div class="expand"><label>왼쪽<input id="left" type="number" min="0" max="2048" value="128"></label><label>오른쪽<input id="right" type="number" min="0" max="2048" value="128"></label><label>위<input id="top" type="number" min="0" max="2048" value="0"></label><label>아래<input id="bottom" type="number" min="0" max="2048" value="128"></label></div></div>
<label for="prompt">3. 바꾸고 싶은 내용</label><textarea id="prompt" placeholder="예: 같은 캐릭터의 얼굴과 헤어를 유지하고, 의상을 검은 재킷으로 바꿔줘."></textarea>
<p class="hint" id="modeHint">얼굴 기준을 계속 참조합니다. 얼굴 동일성은 결과에서 확인하세요.</p><button id="generate" class="primary">이미지 편집하기</button><p class="hint">Grok Imagine 2.0 · 실행 시 API 사용료 발생</p>
</aside><section class="panel"><div class="images"><div class="imagebox"><h3>원본 / 편집 영역</h3><div class="stage"><span id="empty" class="placeholder">원본 이미지를 선택하세요</span><canvas id="canvas" class="hidden"></canvas></div></div><div class="imagebox"><h3>결과</h3><div class="stage"><span id="resultEmpty" class="placeholder">생성한 이미지가 여기에 표시됩니다</span><img id="result" class="hidden" alt="편집 결과"></div><div class="toolbar"><button id="download" disabled>PNG 저장</button><button id="reuse" disabled>결과를 원본으로</button></div></div></div><p id="status" role="status" aria-live="polite">준비 중…</p></section></div>
</main>
<dialog id="keyDialog"><h3>OpenRouter API 키</h3><p class="hint">환경변수 키가 있으면 자동 사용합니다. 여기 입력한 키는 서버 메모리에만 보관되며 서버 종료 시 삭제됩니다.</p><input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-v1-…"><div class="toolbar"><button id="saveKey" class="primary">등록</button><button id="closeKey">닫기</button></div><p id="keyStatus" role="status"></p></dialog>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
let source=null, face=null, resultUrl=null, busy=false, drawing=false;
const mask=document.createElement('canvas'), mctx=mask.getContext('2d');
const status=message=>$('status').textContent=message;
const loadImage=url=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('이미지를 읽을 수 없습니다.'));image.src=url;});
async function fileImage(file){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>12*1024*1024)throw new Error('12MB 이하 PNG, JPG, WebP를 선택하세요.');return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});}
function padding(){const p={};for(const name of ['left','right','top','bottom']){const v=Number($(name).value);if(!Number.isInteger(v)||v<0||v>2048)throw new Error('확장 크기는 0~2048 픽셀 정수로 입력하세요.');p[name]=v;}return p;}
function render(){if(!source)return;let p={left:0,right:0,top:0,bottom:0};if($('mode').value==='outpaint')p=padding();const w=source.width+p.left+p.right,h=source.height+p.top+p.bottom;if(w>8192||h>8192||w*h>32000000)throw new Error('캔버스가 너무 큽니다. 확장 크기를 줄이세요.');canvas.width=w;canvas.height=h;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(source,p.left,p.top);if($('mode').value==='inpaint'){ctx.save();ctx.globalAlpha=.45;ctx.drawImage(mask,0,0);ctx.restore();}$('empty').classList.add('hidden');canvas.classList.remove('hidden');}
function setSource(image){source=image;mask.width=image.width;mask.height=image.height;render();}
$('source').onchange=async()=>{try{const url=await fileImage($('source').files[0]);if(url){const image=await loadImage(url);if(image.width*image.height>24000000)throw new Error('원본은 2400만 픽셀 이하로 선택하세요.');setSource(image);status('원본 준비 완료. 수정 내용을 입력하세요.');}}catch(e){status(e.message);}};
$('face').onchange=async()=>{try{face=await fileImage($('face').files[0]);$('facePreview').src=face||'';$('facePreview').classList.toggle('hidden',!face);$('clearFace').classList.toggle('hidden',!face);}catch(e){status(e.message);}};
$('clearFace').onclick=()=>{face=null;$('face').value='';$('facePreview').classList.add('hidden');$('clearFace').classList.add('hidden');};
$('mode').onchange=()=>{const mode=$('mode').value;$('paintTools').classList.toggle('hidden',mode!=='inpaint');$('expandTools').classList.toggle('hidden',mode!=='outpaint');$('modeHint').textContent=mode==='inpaint'?'칠한 영역을 참조로 편집한 뒤 해당 영역만 합성합니다. 네이티브 마스크 편집이 아니므로 경계·위치를 확인하세요.':mode==='outpaint'?'확장 영역을 생성한 뒤 원본 영역을 그대로 복원합니다. 연결부 품질은 결과에서 확인하세요.':'얼굴 기준을 계속 참조합니다. 얼굴 동일성은 결과에서 확인하세요.';try{render();}catch(e){status(e.message);}};
for(const name of ['left','right','top','bottom'])$(name).oninput=()=>{try{render();}catch(e){status(e.message);}};
$('clearMask').onclick=()=>{mctx.clearRect(0,0,mask.width,mask.height);render();};
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}
let last;
function stroke(e){const p=point(e);mctx.strokeStyle='#ff354f';mctx.fillStyle='#ff354f';mctx.lineWidth=Number($('brush').value);mctx.lineCap='round';mctx.beginPath();mctx.moveTo(last.x,last.y);mctx.lineTo(p.x,p.y);mctx.stroke();mctx.beginPath();mctx.arc(p.x,p.y,mctx.lineWidth/2,0,Math.PI*2);mctx.fill();last=p;render();}
canvas.onpointerdown=e=>{if(busy||!source||$('mode').value!=='inpaint')return;drawing=true;canvas.setPointerCapture(e.pointerId);last=point(e);stroke(e);};canvas.onpointermove=e=>{if(drawing)stroke(e);};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;
function nearestRatio(w,h){return ['1:1','2:3','3:2','3:4','4:3','4:5','5:4','9:16','16:9','1:2','2:1'].sort((a,b)=>{const ratio=s=>{const [x,y]=s.split(':').map(Number);return x/y;};return Math.abs(Math.log(ratio(a)/(w/h)))-Math.abs(Math.log(ratio(b)/(w/h)));})[0];}
async function api(route,body){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'요청 실패');return data;}
function setBusy(value){busy=value;document.querySelectorAll('aside input,aside select,aside textarea,aside button').forEach(el=>el.disabled=value);$('reuse').disabled=value||!resultUrl;$('generate').textContent=value?'편집 중…':'이미지 편집하기';}
$('generate').onclick=async()=>{try{if(!source)throw new Error('원본 이미지를 선택하세요.');const prompt=$('prompt').value.trim();if(!prompt)throw new Error('수정 내용을 입력하세요.');const mode=$('mode').value;render();if(mode==='inpaint'&&!mctx.getImageData(0,0,mask.width,mask.height).data.some((v,i)=>i%4===3&&v))throw new Error('수정할 영역을 원본 위에 칠하세요.');if(mode==='outpaint'&&Object.values(padding()).every(v=>v===0))throw new Error('확장 크기를 입력하세요.');
const base=document.createElement('canvas');base.width=canvas.width;base.height=canvas.height;const bctx=base.getContext('2d');bctx.fillStyle='white';bctx.fillRect(0,0,base.width,base.height);const p=mode==='outpaint'?padding():{left:0,top:0};bctx.drawImage(source,p.left,p.top);
setBusy(true);status('Grok Imagine에 편집을 요청했습니다. 잠시 기다려 주세요.');const data=await api('/api/generate',{mode,prompt,image:base.toDataURL('image/png'),face,guide:mode==='inpaint'?canvas.toDataURL('image/png'):null,aspectRatio:nearestRatio(base.width,base.height)});const image=await loadImage(data.image);const output=document.createElement('canvas');output.width=base.width;output.height=base.height;const octx=output.getContext('2d');octx.drawImage(image,0,0,output.width,output.height);
if(mode==='inpaint'){octx.globalCompositeOperation='destination-in';octx.drawImage(mask,0,0);octx.globalCompositeOperation='destination-over';octx.drawImage(source,0,0);octx.globalCompositeOperation='source-over';}else if(mode==='outpaint'){octx.drawImage(source,p.left,p.top);}
resultUrl=output.toDataURL('image/png');$('result').src=resultUrl;$('result').classList.remove('hidden');$('resultEmpty').classList.add('hidden');$('download').disabled=false;status('편집 완료. 얼굴과 편집 경계를 확인하고 저장하세요.'+(data.cost!=null?' API 비용: $'+data.cost:''));
}catch(e){status(e.message);}finally{setBusy(false);}};
$('download').onclick=()=>{const a=document.createElement('a');a.href=resultUrl;a.download='JO9-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';a.click();};
$('reuse').onclick=async()=>{if(resultUrl){setSource(await loadImage(resultUrl));status('결과를 원본으로 적용했습니다. 얼굴 기준 이미지는 유지됩니다.');}};
$('keyButton').onclick=()=>$('keyDialog').showModal();$('closeKey').onclick=()=>$('keyDialog').close();$('saveKey').onclick=async()=>{try{await api('/api/key',{key:$('apiKey').value});$('apiKey').value='';$('keyDialog').close();status('API 키 등록 완료. 원본을 선택하세요.');}catch(e){$('keyStatus').textContent=e.message;}};
fetch('/api/status').then(r=>r.json()).then(data=>status(data.ready?'API 키 준비 완료. 원본을 선택하세요.':'API 설정에서 키를 등록하세요. 서버를 실행한 터미널의 환경변수도 사용할 수 있습니다.')).catch(()=>status('로컬 서버에 연결할 수 없습니다.'));
</script></html>
