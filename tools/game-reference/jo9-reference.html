처리는 남는다. 근거: рассчет_вреда 44~68행.","졸개는 일반 적의 자원 고갈 판정과 달리 공격 보정에 따른 повержен 상태로 제거되는 분기가 있다. 일반·정예 분류 자체가 방어 배율을 주는 것은 아니다. 근거: атака_игрока 421~432행.","게임 중 하드에서 27종의 특수공격 33개를 선택한다. 기존 평타와 남아 있는 기술을 같은 확률로 고르며 적마다 기술별 전투당 1회다. 쉬움·보통은 기존 평타 선택을 유지한다. 새 전투에서만 사용 이력을 초기화하며 안개 교대·화면 갱신·저장 불러오기는 이력을 보존한다.","이전 정적 감사(376a35f58c8b)의 연결 상태: 일반공격 부가상태는 \u003cbr>이 붙은 키를 넘기지만, 적용부가 순수 상태 키와 비교해 적용이 누락된다. 근거: искусственный_идиот, конец_раунда 144~190행. 현재 QSP는 다른 버전이므로 재확인이 필요하다.","보너스·페널티 필드 이름만으로 적용 대상을 판단하지 않는다. 순수 상태 키 처리에서는 약화·경직·고통·탈력·충격·방심이 플레이어에, 분노·가속·명중·흥분·회피·집중이 행동한 적에 적용된다.","상태 수치는 피해량이나 발동 확률이 아니라 라운드마다 1씩 감소하는 지속 카운터다. 공격 보정은 합산 후 피해 배율로 바뀌므로 상태 하나의 효과를 고정 퍼센트로 해석하지 않는다. 근거: конец_раунда 6~24행, рассчет_вреда 21~50행.","하드의 안개적응은 사용한 적 자신에게 강화와 상태 정리를 적용한다. 원래 정의의 적 1번 고정 대상을 실행 시 시전자에게 맞춘다.","광기의 대마법사는 하드에서 공통 AI로 우회하여 기존 기술을 사용한다. 쉬움·보통의 전용 AI 미연결 문제는 별도다.","이전 정적 감사(376a35f58c8b)의 연결 상태: 아레나 안개 괴물의 저항 블록이 일반 안개 괴물 исчадие에 동일한 값을 다시 쓴다. 일반 개체 값은 그대로지만 아레나 개체의 저항은 별도 설정되지 않는다. 근거: #противники 3294~3304행. 현재 QSP는 다른 버전이므로 재확인이 필요하다.","동적 노예 훈련 상대 воспитуемая는 인물 능력과 착용 갑옷으로 수치·저항을 계산하고, 5개 상시 플래그를 0으로 설정한다. 정적 적 목록에 합산하지 않았다. 근거: начать_бой.","인물용 성기사 jo9_combat_trait=2의 조건부 피해 절반 효과는 소유 인물 전투의 별도 경로다. 적 성기사의 이름이나 정예 분류만으로 자동 적용되지 않는다. 근거: jo9_traits_combat 147~154행.","연결 상태 설명의 정적 감사 기준은 2026-11-11 WORK SHA-256 376a35f58c8bb78b3bafc09f4da60f23f7c51a3462d4bd4d7e413d356f76dbe2이다. 현재 추출본은 감사 기준과 다르므로 연결 상태 설명을 최신 검증으로 간주하지 않는다."],"flagGuide":[{"key":"хрупкий","name":"타격도 체력에 피해","description":"타격이 스태미나·사기와 함께 체력도 깎는다.","count":4},{"key":"тонкое_тело","name":"정신도 체력에 피해","description":"정신 공격이 사기와 함께 체력도 깎는다.","count":0},{"key":"бессмертный","name":"일반 유형 체력 피해 차단","description":"정신·타격 이외의 피해에서 체력 차감을 생략한다. 스태미나·사기 피해 차단과는 별개다.","count":1},{"key":"безустали","name":"스태미나 피해 차단","description":"통상 피해 처리에서 스태미나 차감을 생략한다.","count":10},{"key":"бесстрашный","name":"사기 피해 차단","description":"통상 피해 처리에서 사기 차감을 생략한다.","count":15}],"statusGuide":[{"name":"약화","effect":"자신의  평균(주인공 힘/5, 전투 기술/6, 전투 시작 최대 체력/200, 최대 스태미나/300, 정상 사기/200). 회복·메뉴 재표시로 기준을 다시 계산하지 않는다.","R\u003c70%이면 시작 시 기존 전투 버프 분노·가속·명중·흥분·회피·집중을 각각 99턴으로 부여한다. 묶음 이름은 [춘향의 조소]이며, 시작 멘트는 [춘향이 떨고있는 당신을 보더니 피식 웃으며 대검을 겨누었다.]다.","산도의 일섬은 모든 능력 비율에서 5~10 소모 턴의 무작위 주기마다 발동한다. 회피 자세로만 막을 수 있으며, 발동 턴에는 일반 공격이 겹치지 않는다.","일반 공격 3종은 모두 속도 공격이며 회피 자세를 상성으로 공략한다. 회피 자세 상대 기본 피해 수정자는 +1로, 다른 수정자가 없으면 피해 2배다. 가속 등 해당 버프와 상태의 수정자는 함께 합산한다.","유수보는 각 일섬 주기의 중간 턴(홀수는 내림)에 판정한다. 70≤R≤100%에서만 확률 P=110−R(%)이며, 70/80/90/100%일 때 40/30/20/10%다. 그 밖의 비율에서는 확률 0이다. 성공하면 해당 공격 1회와 그 부가효과를 막고 춘향의 6개 디버프를 제거한다. 춘향의 강화와 주인공 상태는 유지한다.","전장 응급처치: 기적의 연고 쉬움·보통3개 / 게임 중 하드6개. 체력≤60·스태미나≤90·사기≤60 중 하나일 때 사용. 체력·스태미나 완전 회복, 사기+20, 고통0. 공격 대신 1행동을 쓴다. 이미 쓰러진 뒤 부활하지 않는다.","일섬 예정 턴과 회복 조건이 겹치면 일섬을 우선한다. 물약·방어·실제 무기 교체도 소모 턴이다. 메뉴 열기·재표시로 턴/연고/시작 비율을 초기화하지 않는다.","직접 결투는 20만 스파크 이상 보유하면 도전 가능하다. 일반 경기 참가/승수나 빈 주 노예 칸은 요구하지 않는다. 선차감·승리 차감·별도 현금 지급은 없다.","패배·즉사기 강제 패배 모두 CM≤−10 사망 / −10\u003cCM≤0 20만 / 0\u003cCM≤10 10만 / 10\u003cCM≤20 5만 / CM>20 차감0. 반점도 판정한다. 정산은 한 번만 한다.","에게야 영입 후 클럽은 매물로 나오며 비활성 아이콘에 툴팁이 뜬다. 30일 후 춘향이 매입해 재개장한다. 이전 저장에 영입 날짜가 없으면 첫 확인일을 매물 시작일로 기록한다.","춘향 단계 일반 경기는 캐릭터별 최대6회 참가한다. 기존 catfight 누적승수와 별도이며 일반 상대의 기초 체력·스태미나·사기·기본/특수 피해가2배다. 공격 종류·속도·저항과 기존 결과 규칙은 유지한다.","춘향에게 승리하면 클럽 소유권을 즉시 얻는다. 주 노예 칸이 차 있으면 약속을 보존하고 별도 영입 링크를 제공한다. 빈 칸에서 춘향3040을 영입하며 기존 인물·열람 중 매물은 보존한다.","주인공 소유가 된 클럽은 닫힌 채 “재개장하려면 지배인이 필요합니다” 툴팁을 표시한다. 지배인 배치·실제 재개장 기능은 이번 범위에 포함하지 않았다."],"notes":["영입 인물은 사용자 확정 일반 능력·17개 일반 특성·산도·아레나 그랜드 챔피언을 보유한다. 양성애자는 처음부터 숨김 보유, 경험 없음·관련 기술 전부 F다.","승인 배경: 대쥬신제국 암행어사 문수의 산도 → 악당의 계략으로 로마 유입 → 여주인의 검투 노예 → 콜로세움 최고 챔피언으로 자유 획득 → 에게야 이후 클럽 매입.","실제 GUI에서 기존 사용자 SAV 불러오기·장시간 승률/화면 품질은 별도 확인 대상이다. 현재 수치를 임의로75%에 맞춰 올리지 않았다."],"identity":"chunhyang · 영입 인물3040_chunhyang.json"},{"id":"chun_gladiatrix1","name":"여검투사","category":"일반","source":"#противники:3988","stats":[160,200,250,20],"flags":["사기 피해 차단"],"flagKeys":["бесстрашный"],"flagsDefined":true,"resistance":["참격 -4","타격 -4","정신 -5"],"res <script>(function (root) {
 'use strict';
 const kinds=['traits','items','spells'];
 const fields=['title','description','effect','condition','cost','notes'];
 function fail(message){const error=new Error(message);error.status=400;throw error;}
 function makeItem(input,options={}){
  if(!input||typeof input!=='object'||Array.isArray(input))fail('아이디어 형식을 확인하세요.');
  if(!kinds.includes(input.kind))fail('특성·아이템·마법 중 종류를 선택하세요.');
  for(const field of fields)if(input[field]!==undefined&&typeof input[field]!=='string')fail('아이디어 문장은 문자열이어야 합니다.');
  if(!String(input.title||'').trim())fail('아이디어 이름을 입력하세요.');
  const id=options.id||input.id;
  if(typeof id!=='string'||!id.trim())fail('아이디어 ID가 없습니다.');
  const now=options.now||new Date().toISOString(),existing=options.existing;
  const result={...(existing||{}),id,kind:input.kind};
  for(const field of fields)result[field]=input[field]||'';
  result.createdAt=existing?.createdAt||now;result.updatedAt=now;
  return result;
 }
 function document(value){
  if(!value||value.schema!==1||!Array.isArray(value.items))fail('JO9 아이디어 JSON(schema 1)을 선택하세요.');
  const seen=new Set(),items=value.items.map(item=>{
   const now=typeof item.updatedAt==='string'?item.updatedAt:new Date().toISOString();
   const result=makeItem(item,{id:item.id,now,existing:item});
   if(seen.has(result.id))fail('JSON에 중복 아이디어 ID가 있습니다.');seen.add(result.id);return result;
  });
  return{schema:1,items};
 }
 function mergeImport(current,incoming){
  const base=document({schema:1,items:current}),next=document(incoming),ids=new Set(base.items.map(item=>item.id));let added=0,skipped=0;
  for(const item of next.items){if(ids.has(item.id)){skipped++;continue;}base.items.push(item);ids.add(item.id);added++;}
  return{...base,added,skipped};
 }
 const api={kinds,fields,makeItem,document,mergeImport};
 if(typeof module==='object'&&module.exports)module.exports=api;else root.JO9ReferenceIdeas=api;
}(typeof window!=='undefined'?window:globalThis));
</script>
<script>(function(root){
 'use strict';
 const model=typeof module==='object'&&module.exports?require('./ideas-core.cjs'):root.JO9ReferenceIdeas;
 function conflict(){const e=new Error('다른 창의 변경을 불러왔습니다. 작성 중인 내용은 유지했습니다. 확인 후 다시 저장하세요.');e.status=409;throw e;}
 function offlineAdapter(storage){
  const key='jo9-reference-personal-ideas-v1';
  function read(){const raw=storage.getItem(key),doc=raw?model.document(JSON.parse(raw)):{schema:1,items:[]};return{...doc,revision:raw||null,storagePath:'브라우저 저장 · 이 HTML',mode:'browser'};}
  function current(expected){const value=read();if(value.revision!==expected)conflict();return value;}
  function commit(expected,items){current(expected);const doc=model.document({schema:1,items}),raw=JSON.stringify(doc);storage.setItem(key,raw);if(storage.getItem(key)!==raw)throw Error('브라우저 저장 내용을 확인할 수 없습니다. JSON으로 백업하세요.');return read();}
  function upsert(expected,input){const state=current(expected),id=input.id||(root.crypto?.randomUUID?root.crypto.randomUUID():'idea-'+Date.now()+'-'+Math.random().toString(36).slice(2)),old=state.items.find(x=>x.id===id),item=model.makeItem(input,{id,existing:old}),items=state.items.map(x=>x.id===id?item:x);if(!old)items.push(item);return commit(expected,items);}
  function remove(expected,id){const state=current(expected);return commit(expected,state.items.filter(x=>x.id!==id));}
  function importIdeas(expected,value){const state=current(expected),merged=model.mergeImport(state.items,value);if(!merged.added)return{...state,added:0,skipped:merged.skipped};return{...commit(expected,merged.items),added:merged.added,skipped:merged.skipped};}
  return{read,upsert,remove,import:importIdeas,mode:'browser'};
 }
 function httpAdapter(fetcher){
  async function request(url,value){const response=await fetcher(url,value===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});let result;try{result=await response.json();}catch(e){throw Error('개인 기록 서버 응답을 읽을 수 없습니다. 모드툴을 다시 열어 주세요.');}if(!response.ok){const e=new Error(result.error||'저장 요청에 실패했습니다.');e.status=response.status;throw e;}return result;}
  return{mode:'server',read:()=>request('/api/ideas'),upsert:(revision,item)=>request('/api/ideas',{revision,item}),remove:(revision,id)=>request('/api/ideas/delete',{revision,id}),import:(revision,document)=>request('/api/ideas/import',{revision,document})};
 }
 const api={offlineAdapter,httpAdapter};if(typeof module==='object'&&module.exports)module.exports=api;else root.JO9ReferenceIdeasClient=api;
}(typeof window!=='undefined'?window:globalThis));
</script>
<script>'use strict';
function setupEnemies(panel, tab, set) {
  const add = (parent, tag, text, className) => {
    const el = parent.appendChild(document.createElement(tag));
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  };
  const fold = (parent, title) => {
    const details = add(parent, 'details');
    add(details, 'summary', title);
    return details;
  };
  const form = panel.querySelector('form');
  const search = panel.querySelector('input');
  const select = panel.querySelector('select');
  const count = panel.querySelector('.count');
  const list = panel.querySelector('.enemy-list');
  const norm = value => String(value ?? '').normalize('NFKC').toLowerCase();
  const order = new Intl.Collator('ko', { numeric: true });
  const indexed = set.rows.map(row => ({ row, terms: norm(JSON.stringify(row)) }))
    .sort((a, b) => order.compare(a.row.name, b.row.name) || order.compare(a.row.id, b.row.id));
  const useLabel = (row, special) => special.linkedHard ? '하드 전용 · 기술별 1회' : row.aiMissing ? '지정 AI 미연결' : '정의만 있음';
  const effectLabel = special => special.effects.map(effect => `${effect.target} ${effect.name} ${effect.value}`).join(' / ') || '별도 부가상태 없음';
  tab.querySelector('span').textContent = indexed.length.toLocaleString('ko');
  panel.querySelector('.coverage').textContent = set.coverage + ' · 기준 QSP ' + set.hash.slice(0, 12);
  panel.querySelector('.enemy-warning').textContent = set.hardSpecialsEnabled
    ? '특수공격은 게임 중 하드에서만 사용합니다. 일반공격 부가상태의 기존 연결 누락은 별도 항목으로 남아 있습니다.'
    : '특수공격은 정의되어 있지만 현재 AI 선택 경로에 연결되지 않았습니다. 일반공격 부가상태에도 연결 누락이 있습니다.';
  if (!set.auditCurrent) panel.querySelector('.enemy-warning').textContent += ' 연결 상태 설명은 현재 QSP 버전에 재확인이 필요합니다.';
  for (const category of [...new Set(set.rows.map(row => row.category))].sort(order.compare)) select.add(new Option(category, category));
  const guide = panel.querySelector('.enemy-guide');
  const flags = fold(guide, '방어 특성 5종과 활성 적 수');
  const flagList = add(flags, 'ul');
  for (const flag of set.flagGuide) add(flagList, 'li', `${flag.name} (${flag.count}종): ${flag.description}`);
  add(flags, 'p', '속성 수치는 백분율이 아닌 고정 피해 가감입니다. 음수는 감소, 양수는 추가 피해이며 최종 최소 피해 처리는 남습니다.', 'coverage');
  const statuses = fold(guide, '일반공격 부가상태의 뜻');
  const statusList = add(statuses, 'ul');
  for (const status of set.statusGuide) add(statusList, 'li', `${status.name}: ${status.effect}`);
  const notes = fold(guide, '현재 작동 상태와 주의사항');
  const noteList = add(notes, 'ul');
  for (const note of set.notes) add(noteList, 'li', note);

  const skills = fold(guide, '특수공격 기술표');
  skills.className = 'enemy-skill-guide';
  add(skills, 'p', '같은 효과 구성의 기술은 이름을 공유합니다. 피해량·지속값은 사용자마다 다를 수 있습니다. 검색 버튼으로 기술명이나 사용자를 찾을 수 있습니다.', 'coverage');
  const skillTable = add(skills, 'table');
  skillTable.className = 'enemy-special-table';
  const cols = add(skillTable, 'colgroup');
  for (const width of ['17%', '22%', '15%', '32%', '14%']) add(cols, 'col').style.width = width;
  const headings = ['기술명', '사용하는 적 · 기술 번호', '공격 · 기본 피해', '부가효과 · 지속 카운터', '사용 조건'];
  const head = add(add(skillTable, 'thead'), 'tr');
  for (const label of headings) add(head, 'th', label).scope = 'col';
  const skillBody = add(skillTable, 'tbody');

  function render() {
    const words = norm(search.value).trim().split(/\s+/).filter(Boolean);
    const selected = indexed.filter(({ row, terms }) => (!select.value || row.category === select.value) && words.every(word => terms.includes(word)));
    const skillEntries = selected.flatMap(({ row }) => row.supers.map(special => ({ row, special }))).filter(({ row, special }) => {
      const { supers, attacks, ...identity } = row;
      const terms = norm(JSON.stringify(identity) + ' ' + JSON.stringify(special));
      return words.every(word => terms.includes(word));
    });
    skills.querySelector('summary').textContent = `특수공격 기술표 · ${skillEntries.length}개 / 이름 ${new Set(skillEntries.map(x => x.special.name)).size}종`;
    const skillFrag = document.createDocumentFragment();
    for (const { row, special } of skillEntries) {
      const tr = add(skillFrag, 'tr');
      const values = [special.name, `${row.name} 특수 ${special.slot}`, `${special.type} / ${special.damageType} ${special.damage}`, effectLabel(special), useLabel(row, special)];
      for (let i = 0; i < values.length; i++) {
        const cell = add(tr, 'td', values[i]);
        cell.dataset.label = headings[i];
      }
      tr.title = `${row.id} · ${special.source}`;
    }
    if (!skillEntries.length) {
      const empty = add(add(skillFrag, 'tr'), 'td', '선택한 조건에 해당하는 특수공격이 없습니다.');
      empty.colSpan = headings.length;
    }
    skillBody.replaceChildren(skillFrag);

    const frag = document.createDocumentFragment();
    for (const { row } of selected) {
      const card = add(frag, 'article', undefined, 'enemy-card');
      add(card, 'h3', `${row.name} · ${row.category}`);
      add(card, 'p', row.id, 'ref');
      add(card, 'p', `체력 ${row.stats[0]} · 스태미나 ${row.stats[1]} · 사기 ${row.stats[2]} · 기본 피해 ${row.stats[3]}`, 'enemy-stats');
      add(card, 'p', '방어 특성: ' + (row.flags.length ? row.flags.join(' / ') : row.flagsDefined ? '활성 플래그 없음' : '별도 설정 없음'));
      add(card, 'p', '저항·약점: ' + (row.resistance.length ? row.resistance.join(', ') : row.resistanceDefined ? '모두 0' : '별도 설정 없음'));
      if (row.supers.length) add(card, 'p', '특수공격: ' + row.supers.map(special => special.name).join(' / '));
      for (const warning of row.warnings) add(card, 'p', warning, 'enemy-warning');
      const attacks = fold(card, `공격 정의 보기 · 일반 ${row.attacks.length}개 / 특수 ${row.supers.length}개`);
      const attackList = add(attacks, 'ul');
      for (const attack of row.attacks) {
        const available = row.hardAiFallback ? '하드에서 공통 AI로 사용' : row.aiMissing ? '지정 AI 없음' : attack.available ? '기본 AI 선택 범위' : '현재 AI 선택 범위 밖';
        add(attackList, 'li', `일반 ${attack.slot}: ${attack.type} / ${attack.damageType} · ${available}. 부가상태 정의(${set.auditCurrent ? '현재 적용 누락' : '현재 연결 재확인 필요'}): 페널티 ${attack.penalty}, 보너스 ${attack.bonus}, 지속값 ${attack.duration}.`);
      }
      for (const special of row.supers) {
        add(attackList, 'li', `${special.name} · ${row.name} 특수 ${special.slot}: ${special.type} / ${special.damageType} / 기본 피해 ${special.damage}. ${effectLabel(special)}. ${useLabel(row, special)}.`);
      }
      add(attacks, 'p', '특수공격 상태값은 피해량이나 확률이 아닌 상태 카운터 대입값입니다.', 'coverage');
      add(card, 'p', `코드 출처 ${row.source} · AI ${row.ai}`, 'ref');
    }
    if (!selected.length) add(frag, 'p', '조건에 맞는 적이 없습니다.');
    list.replaceChildren(frag);
    count.textContent = `${selected.length.toLocaleString('ko')}종 표시 / 전체 ${indexed.length.toLocaleString('ko')}종`;
  }
  form.addEventListener('submit', event => { event.preventDefault(); render(); });
  form.addEventListener('reset', event => { event.preventDefault(); search.value = ''; select.value = ''; render(); });
  render();
}
</script>
<script>'use strict';
function setupMobs(panel, tab, set) {
  const add = (parent, tag, text, className) => {
    const el = parent.appendChild(document.createElement(tag));
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  };
  const norm = value => String(value ?? '').normalize('NFKC').toLowerCase();
  const order = new Intl.Collator('ko', { numeric: true });
  const form = panel.querySelector('form'), search = form.querySelector('input');
  const state = form.querySelector('[name=state]'), category = form.querySelector('[name=category]'), sort = form.querySelector('[name=sort]');
  const count = panel.querySelector('.count'), body = panel.querySelector('tbody'), detail = panel.querySelector('.mob-detail');
  const indexed = set.rows.map(row => ({ row, terms: norm(JSON.stringify(row)) }));
  let selectedId = null;
  tab.querySelector('span').textContent = set.rows.length.toLocaleString('ko');
  for (const value of [...new Set(set.rows.map(row => row.category))].sort(order.compare)) category.add(new Option(value, value));
  panel.querySelector('.coverage').textContent = `현재 WORK QSP 정의 ${set.definedCount}종 + 미구현 기획 ${set.rows.length - set.definedCount}종 · 기준 QSP ${set.hash.slice(0, 12)}. 기본 정의값이며 전투 중 변화나 승률을 뜻하지 않습니다.`;

  function showDetail(row, focus = false) {
    selectedId = row.id;
    detail.hidden = false;
    detail.replaceChildren();
    detail.className = 'enemy-card mob-detail' + (row.planned ? ' mob-planned' : '');
    add(detail, 'h3', `${row.name} · ${row.state}`);
    add(detail, 'p', row.identity || row.id, 'ref');
    add(detail, 'p', `체력 ${row.stats[0]} · 스태미나 ${row.stats[1]} · 사기 ${row.stats[2]} · 기본 피해 ${row.stats[3]}`, 'enemy-stats');
    add(detail, 'p', row.comparison, 'coverage');
    add(detail, 'p', '방어 특성: ' + (row.flags.length ? row.flags.join(' / ') : '별도 활성 특성 없음'));
    add(detail, 'p', '저항·약점: ' + (row.resistance.length ? row.resistance.join(', ') : row.resistanceDefined ? '모두 0' : '별도 설정 없음'));
    add(detail, 'p', '특수능력: ' + (row.skills.length ? row.skills.join(' / ') : '별도 정의 없음'));
    if (row.rules.length) {
      const rules = add(detail, 'details');
      add(rules, 'summary', row.planned ? '확정 기획 · 전투·회복·결투 규칙' : '실제 연결된 전투·회복·승계·영입 규칙');
      const list = add(rules, 'ul');
      for (const rule of row.rules) add(list, 'li', rule);
    }
    if (!row.planned) {
      const attacks = add(detail, 'details');
      add(attacks, 'summary', `공격 정보 · 일반 ${row.attacks.length}개 / 특수 ${row.supers.length}개`);
      const list = add(attacks, 'ul');
      for (const attack of row.attacks) add(list, 'li', `일반 ${attack.slot}: ${attack.type} / ${attack.damageType} · 페널티 ${attack.penalty} · 보너스 ${attack.bonus} · 지속값 ${attack.duration}`);
      for (const skill of row.supers) add(list, 'li', `${skill.name} · 특수 ${skill.slot}: ${skill.type} / ${skill.damageType} ${skill.damage} · ${skill.effects.map(e => `${e.target} ${e.name} ${e.value}`).join(' / ') || '별도 부가상태 없음'} · ${skill.linkedHard ? '하드 전용 · 기술별 전투당 1회' : '현재 AI 연결 재확인 필요'}`);
      add(detail, 'p', '일반공격 부가상태의 연결 누락 등 실제 작동 상태는 아래 주의사항과 기존 적 전투 특성 탭을 함께 확인하세요.', 'coverage');
    }
    if (row.notes.length) {
      const notes = add(detail, 'details');
      add(notes, 'summary', '작동 상태와 주의사항');
      const list = add(notes, 'ul');
      for (const note of row.notes) add(list, 'li', note);
    }
    add(detail, 'p', `자료 출처: ${row.source}${row.ai ? ' · AI ' + row.ai : ''}`, 'ref');
    if (focus) detail.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function render() {
    const words = norm(search.value).trim().split(/\s+/).filter(Boolean);
    const selected = indexed.filter(({ row, terms }) => (!state.value || (row.planned ? 'planned' : 'defined') === state.value)
      && (!category.value || row.category === category.value) && words.every(word => terms.includes(word)));
    selected.sort((a, b) => sort.value === 'name' ? order.compare(a.row.name, b.row.name)
      : b.row.stats[Number(sort.value)] - a.row.stats[Number(sort.value)] || order.compare(a.row.name, b.row.name));
    const frag = document.createDocumentFragment();
    for (const { row } of selected) {
      const tr = add(frag, 'tr');
      if (row.planned) tr.className = 'mob-planned';
      const identity = add(tr, 'td'); identity.dataset.label = 'MOB';
      const button = add(identity, 'button', row.name, 'mob-name'); button.type = 'button';
      button.setAttribute('aria-label', row.name + ' 상세 보기');
      button.addEventListener('click', () => showDetail(row, true));
      add(identity, 'span', row.state, 'ref');
      add(identity, 'span', row.id, 'ref');
      const values = [row.category, ...row.stats];
      const labels = ['분류', '체력', '스태미나', '사기', '기본 피해'];
      for (let i = 0; i < values.length; i++) add(tr, 'td', String(values[i])).dataset.label = labels[i];
    }
    if (!selected.length) add(add(frag, 'tr'), 'td', '조건에 맞는 MOB이 없습니다.').colSpan = 6;
    body.replaceChildren(frag);
    if (!selected.length) {
      selectedId = null;
      detail.replaceChildren();
      detail.hidden = true;
    } else if (!selected.some(({ row }) => row.id === selectedId)) showDetail(selected[0].row);
    count.textContent = `${selected.length}종 표시 / QSP 정의 ${set.definedCount}종 + 미구현 기획 ${set.rows.length - set.definedCount}종`;
  }
  form.addEventListener('submit', event => { event.preventDefault(); render(); });
  form.addEventListener('reset', event => { event.preventDefault(); search.value = ''; state.value = ''; category.value = ''; sort.value = 'name'; render(); });
  showDetail(set.rows.find(row => row.id === 'chunhyang') || set.rows[0]);
  render();
}
</script>
<script>
  'use strict';
  const data = JSON.parse(document.getElementById('reference-data').textContent);
  const kinds = ['traits', 'items', 'spells', 'mobs', 'enemies', 'ideas'];
  let enemiesReady = false;
  let mobsReady = false;
  document.querySelector('#mobs-tab span').textContent = data.mobs.rows.length.toLocaleString('ko');
  document.querySelector('#enemies-tab span').textContent = data.enemies.rows.length.toLocaleString('ko');
  const tabs = kinds.map(kind => document.getElementById(kind + '-tab'));
  const panels = kinds.map(kind => document.getElementById(kind + '-panel'));
  const template = document.getElementById('reference-panel');
  const order = new Intl.Collator('ko', { numeric: true });
  const normalize = value => String(value ?? '').normalize('NFKC').toLowerCase();
  const unknownSource = '획득처 미확인';

  function itemGroups(row) {
    const routes = (row.acquisition || unknownSource).split(/\r?\n/).filter(Boolean);
    return [...new Set(routes.map(route => route
      .replace(/(?: \(조수용 메뉴\))? 구매(?: · .*)?$/, '')
      .replace(/ · [\d,]+스파크.*$/, '')
      .replace(/^(바티칸 외곽 · 중앙 포럼) · .+$/, '$1')
      .replace(/^(?:일반 )?새 게임 시작 시 .+$/, '새 게임 시작 지급')
      .replace(/^튜토리얼 시작 시 \d+개$/, '튜토리얼 시작 지급')
      .replace(/^(?:입수 경로|일반 진행 획득처) 미확인$/, unknownSource)))];
  }

  function compareGroups(left, right) {
    return Number(left === unknownSource) - Number(right === unknownSource) || order.compare(left, right);
  }

  function setup(panel, tab, set, kind) {
    const isTrait = kind === 'traits', isSpell = kind === 'spells';
    panel.append(template.content.cloneNode(true));
    const input = panel.querySelector('input');
    const select = panel.querySelector('select');
    const body = panel.querySelector('tbody');
    const count = panel.querySelector('.count');
    const indexed = set.rows.map(row => {
      const groups = isTrait || isSpell ? [row.category] : itemGroups(row);
      const terms = normalize([row.name, row.category, row.id, row.description, row.source, row.policy, row.price, row.acquisition, row.requirements, row.usage, ...groups, ...(row.aliases || [])].join(' '));
      return { row, groups, terms };
    }).sort((a, b) => compareGroups(a.groups[0], b.groups[0]) || order.compare(a.row.name, b.row.name) || order.compare(a.row.id, b.row.id));
    tab.querySelector('span').textContent = indexed.length.toLocaleString('ko');
    panel.querySelector('.coverage').textContent = set.coverage || '';
    const acquisitionLabel = isTrait ? '발현·획득 조건' : isSpell ? '직접 메뉴 조건' : '획득처';
    panel.querySelector('.acquisition-heading').textContent = acquisitionLabel;
    if (isSpell) panel.querySelector('thead th:nth-child(3)').textContent = '소모';
    panel.querySelector('.group-label').textContent = isTrait || isSpell ? '분류' : '획득처';
    select.add(new Option(isTrait || isSpell ? '모든 분류' : '모든 획득처', ''));
    const totals = new Map();
    for (const { groups } of indexed) {
      for (const group of groups) totals.set(group, (totals.get(group) || 0) + 1);
    }
    for (const group of [...totals.keys()].sort(compareGroups)) select.add(new Option(`${group} (${totals.get(group)})`, group));

    function render() {
      const words = normalize(input.value).trim().split(/\s+/).filter(Boolean);
      const selected = indexed.filter(({ groups, terms }) => (!select.value || groups.includes(select.value)) && words.every(word => terms.includes(word)));
      const frag = document.createDocumentFragment();
      for (const { row } of selected) {
        const tr = frag.appendChild(document.createElement('tr'));
        const title = tr.insertCell();
        const label = title.appendChild(document.createElement('strong'));
        label.textContent = row.name;
        if (row.id) {
          const ref = title.appendChild(document.createElement('span'));
          ref.className = 'ref';
          ref.textContent = row.id;
          if (row.source) ref.title = row.source;
        }
        tr.insertCell().textContent = row.category;
        const price = tr.insertCell();
        price.dataset.label = isSpell ? '소모' : '가격';
        price.textContent = typeof row.price === 'number' ? `기본가 ${row.price.toLocaleString('ko')}스파크` : row.price || (isTrait ? '—' : '가격 미확인');
        const acquisition = tr.insertCell();
        acquisition.dataset.label = acquisitionLabel;
        acquisition.textContent = row.acquisition || (isTrait ? '발현 조건 미확인' : '획득처 미확인');
        if (row.acquisitionSource) acquisition.title = row.acquisitionSource;
        const description = tr.insertCell();
        description.dataset.label = '설명';
        description.textContent = row.description?.replace(/(?:^|\n)기본 가격 [\d,]+스파크$/, '').trim() || '별도 설명 없음';
        if (row.policy) {
          const policy = description.appendChild(document.createElement('span'));
          policy.className = 'ref';
          policy.textContent = '카오틱 에센스 · ' + row.policy;
        }
        if (isSpell) {
          const ref = description.appendChild(document.createElement('span'));
          ref.className = 'ref';
          ref.textContent = (row.linked ? '직접 메뉴 연결 확인' : '호출 미확인') + ' · ' + row.usage + ' · ' + row.source;
          const details = description.appendChild(document.createElement('details'));
          details.appendChild(document.createElement('summary')).textContent = '조건·효과 코드 보기';
          details.appendChild(document.createElement('pre')).textContent = row.code || '';
        }
      }
      if (!selected.length) {
        const empty = frag.appendChild(document.createElement('tr')).insertCell();
        empty.colSpan = 5;
        empty.textContent = '조건에 맞는 항목이 없습니다.';
      }
      body.replaceChildren(frag);
      count.textContent = `${selected.length.toLocaleString('ko')}개 표시 / 전체 ${indexed.length.toLocaleString('ko')}개`;
    }
    input.addEventListener('input', render);
    select.addEventListener('change', render);
    render();
  }

  function selectTab(index, focus = false) {
    if (kinds[index] === 'mobs' && !mobsReady) {
      setupMobs(panels[index], tabs[index], data.mobs);
      mobsReady = true;
    }
    if (kinds[index] === 'enemies' && !enemiesReady) {
      setupEnemies(panels[index], tabs[index], data.enemies);
      enemiesReady = true;
    }
    tabs.forEach((tab, i) => {
      tab.setAttribute('aria-selected', String(index === i));
      tab.tabIndex = index === i ? 0 : -1;
      panels[i].hidden = index !== i;
    });
    if (focus) tabs[index].focus();
  }

  tabs.forEach((tab, i) => {
    if (!['ideas', 'enemies', 'mobs'].includes(kinds[i])) setup(panels[i], tab, data[kinds[i]], kinds[i]);
    tab.addEventListener('click', () => selectTab(i));
    tab.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const last = tabs.length - 1;
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? last : (i + (event.key === 'ArrowRight' ? 1 : last)) % tabs.length;
      selectTab(next, true);
    });
  });
  const build = data.traits.hash.slice(0, 12);
  document.getElementById('snapshot').textContent = `특성·아이템·마법 기준 QSP ${build} · 적 전투 기준 QSP ${data.enemies.hash.slice(0, 12)}`;
</script>
<script>(function(){
 'use strict';
 const $=id=>document.getElementById(id),panel=$('ideas-panel'),model=window.JO9ReferenceIdeas,clients=window.JO9ReferenceIdeasClient;
 const names={traits:'특성',items:'아이템',spells:'마법'},fields=['kind',...model.fields];
 let adapter;
 try{adapter=location.protocol==='file:'?clients.offlineAdapter(window.localStorage):clients.httpAdapter(window.fetch.bind(window));}
 catch(e){$('idea-message').textContent='브라우저 저장을 사용할 수 없습니다: '+e.message;return;}
 let state={items:[],revision:null},loaded=false,busy=false,editingId=null,clean='',deleteArmed=false;
 function draft(){return Object.fromEntries(fields.map(key=>[key,$('idea-'+key).value]));}
 const dirty=()=>JSON.stringify(draft())!==clean;
 function message(text,error=false){$('idea-message').textContent=text;$('idea-message').classList.toggle('error',error);}
 function resetDelete(){deleteArmed=false;$('idea-delete').textContent='삭제';}
 function setBusy(value){busy=value;for(const el of panel.querySelectorAll('button,input,select,textarea'))el.disabled=value;$('idea-save').disabled=value||!loaded;$('idea-delete').disabled=value||!editingId;$('idea-save').textContent=value?'처리 중…':'아이디어 저장';}
 function setForm(item){
  editingId=item?.id||null;for(const key of fields)$('idea-'+key).value=item?.[key]??(key==='kind'?'traits':'');
  clean=JSON.stringify(draft());resetDelete();$('idea-editor-title').textContent=item?'아이디어 수정':'새 아이디어';$('idea-delete').disabled=!editingId||busy;
 }
 function mayDiscard(){return !dirty()||window.confirm('작성 중인 수정 내용이 있습니다. 저장하지 않고 바꾸시겠습니까?');}
 function renderList(){
  const words=$('idea-search').value.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean),kind=$('idea-filter').value;
  const rows=state.items.filter(item=>(!kind||item.kind===kind)&&words.every(word=>[item.title,item.description,item.effect,item.condition,item.cost,item.notes].join(' ').normalize('NFKC').toLowerCase().includes(word))).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))||a.title.localeCompare(b.title,'ko'));
  const list=$('idea-list');list.replaceChildren();
  for(const item of rows){
   const button=document.createElement('button');button.type='button';button.className='idea-entry';button.disabled=busy;button.setAttribute('aria-current',String(item.id===editingId));
   button.appendChild(document.createElement('strong')).textContent=item.title;
   button.appendChild(document.createElement('span')).textContent=names[item.kind]+' · '+(item.description||item.effect||item.notes||'내용을 추가하세요.').slice(0,90);
   button.addEventListener('click',()=>{if(busy||!mayDiscard())return;setForm(item);renderList();message('저장된 아이디어를 불러왔습니다.');});list.appendChild(button);
  }
  if(!rows.length){const p=document.createElement('p');p.className='coverage';p.textContent=state.items.length?'검색 조건에 맞는 아이디어가 없습니다.':'새 아이디어를 작성하고 저장하세요.';list.appendChild(p);}
  $('idea-count').textContent=rows.length+'개 표시 / 전체 '+state.items.length+'개';$('ideas-tab').querySelector('span').textContent=state.items.length;
 }
 function accept(value){state=value;loaded=true;renderList();$('idea-storage').textContent=adapter.mode==='server'?'개인 파일 저장 · '+value.storagePath:'브라우저 저장 · JSON 백업으로 다른 브라우저에 옮길 수 있습니다.';}
 async function perform(fn){
  if(busy)return;setBusy(true);
  try{await fn();}
  catch(e){if(e.status===409){try{accept(await adapter.read());}catch(readError){message(readError.message,true);return;}}message(e.message||'저장하지 못했습니다. 입력을 유지했습니다.',true);}
  finally{setBusy(false);}
 }
 $('idea-form').addEventListener('submit',event=>{
  event.preventDefault();if(!loaded)return;
  perform(async()=>{const value=draft();model.makeItem(value,{id:editingId||'new'});const beforeIds=new Set(state.items.map(x=>x.id));const result=await adapter.upsert(state.revision,{...value,...(editingId?{id:editingId}:{})});accept(result);const saved=editingId?state.items.find(x=>x.id===editingId):state.items.find(x=>!beforeIds.has(x.id));setForm(saved);renderList();message('저장했습니다.');});
 });
 $('idea-new').addEventListener('click',()=>{if(busy||!mayDiscard())return;setForm(null);renderList();message('새 아이디어를 작성하세요.');$('idea-title').focus();});
 $('idea-cancel').addEventListener('click',()=>{if(busy||!mayDiscard())return;setForm(state.items.find(x=>x.id===editingId)||null);renderList();message('저장된 내용으로 돌아갔습니다.');});
 $('idea-delete').addEventListener('click',()=>{
  if(busy||!editingId)return;
  if(!deleteArmed){deleteArmed=true;$('idea-delete').textContent='삭제 확인';message('이 아이디어와 작성 중인 수정 내용을 삭제하려면 ‘삭제 확인’을 누르세요.');return;}
  perform(async()=>{accept(await adapter.remove(state.revision,editingId));setForm(null);renderList();message('아이디어를 삭제했습니다.');});
 });
 $('idea-reload').addEventListener('click',()=>perform(async()=>{accept(await adapter.read());message('최신 목록을 불러왔습니다. 작성 중인 내용은 유지했습니다.');}));
 $('idea-search').addEventListener('input',renderList);$('idea-filter').addEventListener('change',renderList);
 $('idea-form').addEventListener('input',()=>{resetDelete();message(dirty()?'작성 중인 변경이 있습니다. ‘아이디어 저장’을 눌러 보관하세요.':'저장된 내용과 같습니다.');});
 $('idea-export').addEventListener('click',()=>perform(async()=>{
  accept(await adapter.read());const data={schema:1,items:state.items},blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());a.href=url;a.download='JO9_개인아이디어_'+date+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('개인 아이디어 JSON 백업을 내보냈습니다.');
 }));
 $('idea-import').addEventListener('click',()=>{if(!busy&&loaded)$('idea-file').click();});
 $('idea-file').addEventListener('change',()=>{const file=$('idea-file').files[0];if(!file)return;perform(async()=>{const value=model.document(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));const result=await adapter.import(state.revision,value);accept(result);message(result.added+'개 추가 · 기존 ID '+result.skipped+'개 유지. 작성 중인 내용은 그대로입니다.');});$('idea-file').value='';});
 window.addEventListener('beforeunload',event=>{if(dirty()){event.preventDefault();event.returnValue='';}});
 setForm(null);perform(async()=>{accept(await adapter.read());message('아이디어를 작성하고 저장할 수 있습니다.');});
}());
</script>
</html>
